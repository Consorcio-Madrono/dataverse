auth.providers.orcid.helpmessage1=ORCID est une initiative communautaire, ouverte et sans but lucratif visant \u00e0 fournir un registre d'identifiants uniques de chercheurs ainsi qu'une m\u00e9thode transparente pour lier les activit\u00e9s et produits de la recherche \u00e0 ces identifiants. ORCID est unique dans sa capacit\u00e9 \u00e0 atteindre les intervenants de toutes disciplines, secteurs de recherche et fronti\u00e8res nationales confondus ainsi que de coop\u00e9rer avec d'autres syst\u00e8mes d'identifiants. Pour en apprendre davantage visitez <a href="https://orcid.org/about" title="\u00c0 propos de ORCID" target="_blank" rel="noopener">orcid.org/about</a>.
