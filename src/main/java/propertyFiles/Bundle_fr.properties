readmeTxt.text1=Readme.txt <a target="_blank" download="readme-en.txt" href="https://edatos.consorciomadrono.es/resources/txt/readme-en.txt">English version</a>, <a target="_blank" download="readme-es.txt" href="https://edatos.consorciomadrono.es/resources/txt/readme-es.txt">Spanish version</a>) is a template for researchers who want to deposit a dataset in e-cienciaDatos.
readmeTxt.text2=All datasets must be documented to be understandable and reusable: authorship, title, description, methodology, funding projects, temporal and spatial coverage, rights of use and privacy, etc.
readmeTxt.text3=The e-cienciaDatos repository managers will use the information provided in the readme.txt template to:
